else if(h=='"')q=true;else if(h==d){r.push(c);c=''}

go()}
function go(){const q=N($('q').value.trim()),i=L;

else if(i>0){cl=' class="one"';const v=e.f[i];o=v?`<div><dt>${LB[i]}</dt><dd${i===1?' class="fr"':''}>${fm(v,q)}</dd></div>`:`<div><dt>${LB[i]}</dt><dd class="miss">Traducción faltante<button class="sug" data-k="${e.k}" data-l="${i}">Sugerir traducción</button></dd></div>`}

.catch(()=>{$('o').innerHTML='<p class="empty"><b>No se pudo cargar data.csv.</b> Comprueba que esté en la misma carpeta que index.html y que la página se abra desde un servidor web, no con doble clic.</p>'});
