<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Diccionario técnico</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg:#fff;--ink:#0A0A0A;--mu:#6B6B6B;--ln:#E4E4E1;--ph:#EEEEEC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1200px;margin:0 auto;padding:18px 24px 96px}
.g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 16px}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding-top:6px}
.bar{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.hero{margin-top:72px;row-gap:32px}.hero .tag{grid-column:1/4}
h1{grid-column:4/13;margin:0;font-weight:600;font-size:clamp(38px,8.2vw,112px);line-height:.9;letter-spacing:-.045em;text-transform:uppercase}
.about{grid-column:7/13;margin:0;font-size:13px;font-weight:500;max-width:44ch}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:88px}
.fig{display:block;background:none;border:0;padding:0;margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.ph{position:relative;aspect-ratio:4/3;background:var(--ph);overflow:hidden}
.ph svg,.ph img{position:absolute;inset:0;width:100%;height:100%}.ph svg{padding:6%;box-sizing:border-box}
.ph img{object-fit:cover;filter:grayscale(1) contrast(1.05)}
.fig span{display:block;margin-top:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.fig:hover span,.fig:focus-visible span{color:var(--ink)}
.ctl{margin-top:96px;row-gap:22px}.ctl .tag{grid-column:1/4}.ctl .box{grid-column:4/13}
#q{display:block;width:100%;box-sizing:border-box;margin:0;padding:0 0 10px;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:none;color:var(--ink);font:600 clamp(26px,4.6vw,52px)/1.1 Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.03em;text-transform:uppercase;-webkit-appearance:none;appearance:none}
#q::placeholder{color:#C4C4C0}#q:focus{outline:none;box-shadow:0 2px 0 var(--ink)}#q::-webkit-search-cancel-button{display:none}
.opt{display:inline-flex;align-items:center;gap:7px;background:none;border:0;border-bottom:1.5px solid transparent;border-radius:0;padding:3px 0;margin:0 20px 8px 0;font:inherit;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mu);cursor:pointer}
.opt i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.opt[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink)}.opt:hover{color:var(--ink)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#o{margin-top:56px;border-top:1px solid var(--ink)}
.row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:0 16px;padding:24px 0 26px;border-bottom:1px solid var(--ln)}
.l{grid-column:1/5;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
h2{margin:0;font-size:24px;line-height:1.15;font-weight:600;letter-spacing:-.025em}
.lg,dt{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.cat{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--mu)}.cat i{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c)}
dl{grid-column:5/13;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px;align-content:start}
dd{margin:3px 0 0;font-size:16px}dd.fr{font-weight:600}
mark{background:#0A0A0A;color:#fff;padding:0 2px}
.empty{margin:36px 0;color:var(--mu)}
@media(max-width:760px){main{padding:14px 18px 72px}.hero{margin-top:48px}.hero .tag,h1,.about,.ctl .tag,.ctl .box{grid-column:1/13}.about{margin-top:0}.strip{margin-top:56px;gap:6px}.fig span{font-size:10px}.ctl{margin-top:64px;row-gap:14px}.row{padding:20px 0}.l,dl{grid-column:1/13}dl{margin-top:14px;grid-template-columns:1fr 1fr}.opt{margin-right:16px}}
</style></head><body><main><div class="bar"><span>ES FR EN IT DE</span><span id="n"></span></div><section class="g hero"><span class="tag">[ Acerca ]</span><h1>Diccionario técnico</h1><p class="about">Vocabulario técnico en cinco idiomas. Escribe un término en cualquier idioma y consulta sus traducciones.</p></section><section class="strip"><button class="fig" data-q="tabique"><div class="ph"><svg viewBox="0 0 400 300" fill="none" stroke="#0A0A0A" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="40" y="112" width="320" height="10" fill="#fff"/><rect x="40" y="178" width="320" height="10" fill="#fff"/><path d="M69 178V125H91V178"/><path d="M149 178V125H171V178"/><path d="M229 178V125H251V178"/><path d="M309 178V125H331V178"/><path d="M94 176 L102.7 128 L111.3 176 L120.0 128 L128.7 176 L137.3 128 L146.0 176" stroke-width="1"/><path d="M174 176 L182.7 128 L191.3 176 L200.0 128 L208.7 176 L217.3 128 L226.0 176" stroke-width="1"/><path d="M254 176 L262.7 128 L271.3 176 L280.0 128 L288.7 176 L297.3 128 L306.0 176" stroke-width="1"/><path d="M40 214H360M40 206V222M360 206V222" stroke-width="1"/></svg><img src="img/foto1.jpg" alt="" onerror="this.remove()"></div><span>[ Tabique ]</span></button><button class="fig" data-q="falso techo"><div class="ph"><svg viewBox="0 0 400 300" fill="none" stroke="#0A0A0A" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="30" y="36" width="340" height="16" fill="#fff"/><path d="M30 52l12 -16" stroke-width=".8"/><path d="M42 52l12 -16" stroke-width=".8"/><path d="M54 52l12 -16" stroke-width=".8"/><path d="M66 52l12 -16" stroke-width=".8"/><path d="M78 52l12 -16" stroke-width=".8"/><path d="M90 52l12 -16" stroke-width=".8"/><path d="M102 52l12 -16" stroke-width=".8"/><path d="M114 52l12 -16" stroke-width=".8"/><path d="M126 52l12 -16" stroke-width=".8"/><path d="M138 52l12 -16" stroke-width=".8"/><path d="M150 52l12 -16" stroke-width=".8"/><path d="M162 52l12 -16" stroke-width=".8"/><path d="M174 52l12 -16" stroke-width=".8"/><path d="M186 52l12 -16" stroke-width=".8"/><path d="M198 52l12 -16" stroke-width=".8"/><path d="M210 52l12 -16" stroke-width=".8"/><path d="M222 52l12 -16" stroke-width=".8"/><path d="M234 52l12 -16" stroke-width=".8"/><path d="M246 52l12 -16" stroke-width=".8"/><path d="M258 52l12 -16" stroke-width=".8"/><path d="M270 52l12 -16" stroke-width=".8"/><path d="M282 52l12 -16" stroke-width=".8"/><path d="M294 52l12 -16" stroke-width=".8"/><path d="M306 52l12 -16" stroke-width=".8"/><path d="M318 52l12 -16" stroke-width=".8"/><path d="M330 52l12 -16" stroke-width=".8"/><path d="M342 52l12 -16" stroke-width=".8"/><path d="M354 52l12 -16" stroke-width=".8"/><path d="M100 52V128"/><circle cx="100" cy="52" r="2.5" fill="#0A0A0A"/><path d="M200 52V128"/><circle cx="200" cy="52" r="2.5" fill="#0A0A0A"/><path d="M300 52V128"/><circle cx="300" cy="52" r="2.5" fill="#0A0A0A"/><rect x="40" y="128" width="320" height="6" fill="#fff"/><rect x="40" y="134" width="320" height="9" fill="#fff"/><path d="M120 134V143" stroke-width="1"/><path d="M200 134V143" stroke-width="1"/><path d="M280 134V143" stroke-width="1"/><path d="M386 52V143M380 52H392M380 143H392" stroke-width="1"/></svg><img src="img/foto2.jpg" alt="" onerror="this.remove()"></div><span>[ Falso techo ]</span></button><button class="fig" data-q="dintel"><div class="ph"><svg viewBox="0 0 400 300" fill="none" stroke="#0A0A0A" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="60" y="50" width="280" height="200" fill="#fff"/><rect x="150" y="120" width="100" height="130" fill="#EEEEEC"/><rect x="138" y="100" width="124" height="20" fill="#fff"/><path d="M146 120L160 100" stroke-width=".8"/><path d="M160 120L174 100" stroke-width=".8"/><path d="M174 120L188 100" stroke-width=".8"/><path d="M188 120L202 100" stroke-width=".8"/><path d="M202 120L216 100" stroke-width=".8"/><path d="M216 120L230 100" stroke-width=".8"/><path d="M230 120L244 100" stroke-width=".8"/><path d="M244 120L258 100" stroke-width=".8"/><path d="M30 250H370"/><path d="M60 30H340M60 22V38M340 22V38" stroke-width="1"/></svg><img src="img/foto3.jpg" alt="" onerror="this.remove()"></div><span>[ Dintel ]</span></button></section><section class="g ctl"><span class="tag">[ Buscar ]</span><div class="box"><input id="q" type="search" placeholder="Escribe un término" autocomplete="off" aria-label="Buscar un término"></div><span class="tag">[ Idioma ]</span><div class="box" id="seg" role="group" aria-label="Idioma de búsqueda"></div><span class="tag">[ Categoría ]</span><div class="box" id="chips" role="group" aria-label="Categoría"></div></section><section id="o" aria-live="polite"></section></main><script>
const LB=['Español','Français','English','Italiano','Deutsch'],SC='Sin clasificar';
const CC={'Elementos constructivos':'#B5694C','Materiales':'#7A7E55','Elementos de tienda/distribución':'#C6AA7C','Organización obra':'#2F4160','Presupuesto/gestión/administración':'#7C6572','Dibujo técnico/Revit':'#5F807C','Oficios':'#C49A8B','Sin clasificar':'#ABA79F'};
const N=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const $=i=>document.getElementById(i),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ix=c=>{const i=Object.keys(CC).findIndex(k=>N(k)===N(c));return i<0?99:i};
const col=c=>{const k=Object.keys(CC).find(k=>N(k)===N(c));return k?CC[k]:'#ABA79F'};
const hl=(s,q)=>{if(!q)return esc(s);const n=N(s),k=n.length===s.length?n.indexOf(q):-1;return k<0?esc(s):esc(s.slice(0,k))+'<mark>'+esc(s.slice(k,k+q.length))+'</mark>'+esc(s.slice(k+q.length))};
let E=[],cat='',L=-1;
function parse(t){t=t.replace(/^\uFEFF/,'');const l=t.split('\n')[0],d=(l.match(/;/g)||[]).length>(l.match(/,/g)||[]).length?';':',';
const R=[];let r=[],c='',q=false;
for(let i=0;i<t.length;i++){const h=t[i];
if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=h}
else if(h=='"')q=true;else if(h==d){r.push(c);c=''}
else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=h}
if(c||r.length){r.push(c);R.push(r)}return R}
function bar(){$('seg').innerHTML=['Todos',...LB].map((n,j)=>`<button class="opt" data-l="${j-1}" aria-pressed="${j-1===L}">${n}</button>`).join('')}
function init(t){E=parse(t).slice(1).filter(p=>(p[0]||'').trim().length>1).map(p=>({f:[0,1,2,3,4].map(i=>(p[i]||'').trim()),c:(p[5]||'').trim()||SC}));
const cats=[...new Set(E.map(e=>e.c))].sort((a,b)=>ix(a)-ix(b)||a.localeCompare(b));
$('chips').innerHTML=`<button class="opt" data-c="" aria-pressed="true">Todas</button>`+cats.map(c=>`<button class="opt" style="--c:${col(c)}" data-c="${esc(c)}" aria-pressed="false"><i></i>${esc(c)}</button>`).join('');
go()}
function go(){const q=N($('q').value.trim()),i=L;let r=E.filter(e=>(!cat||e.c===cat)&&(!q||N(i<0?e.f.join(' '):e.f[i]).includes(q)));
r.forEach(e=>{const m=i>=0?i:(q?e.f.findIndex(v=>N(v).includes(q)):0);e.m=m>=0&&e.f[m]?m:0});
const sc=e=>{if(!q)return 0;const h=N(e.f[e.m]);return h.startsWith(q)?0:h.includes(' '+q)?1:2};
r.sort((a,b)=>sc(a)-sc(b)||N(a.f[a.m]).localeCompare(N(b.f[b.m])));
$('n').textContent=r.length+(r.length===1?' término':' términos');
$('o').innerHTML=r.length?r.map(e=>{const o=e.f.map((v,j)=>v&&j!==e.m?`<div><dt>${LB[j]}</dt><dd${j===1?' class="fr"':''}>${esc(v)}</dd></div>`:'').join('');
return`<article class="row" style="--c:${col(e.c)}"><div class="l"><h2>${hl(e.f[e.m],q)}</h2><span class="lg">${LB[e.m]}</span><span class="cat"><i></i>${esc(e.c)}</span></div>${o?`<dl>${o}</dl>`:''}</article>`}).join(''):`<p class="empty">No hay resultados${q?` para «${esc($('q').value.trim())}»`:''}. Prueba con otra palabra o cambia el idioma de búsqueda.</p>`}
$('q').oninput=go;
$('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;L=+b.dataset.l;bar();go()};
$('chips').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;[...$('chips').children].forEach(x=>x.setAttribute('aria-pressed',x===b));go()};
document.querySelectorAll('.fig').forEach(b=>b.onclick=()=>{$('q').value=b.dataset.q;L=-1;bar();go();$('q').scrollIntoView({block:'center'});$('q').focus({preventScroll:true})});
bar();if(matchMedia('(pointer:fine)').matches)$('q').focus({preventScroll:true});
fetch('data.csv',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>{let t=new TextDecoder('utf-8').decode(b);if(t.includes('\uFFFD'))t=new TextDecoder('windows-1252').decode(b);init(t)})
.catch(()=>{$('o').innerHTML='<p class="empty"><b>No se pudo cargar data.csv.</b> Comprueba que esté en la misma carpeta que index.html y que la página se abra desde un servidor web, no con doble clic.</p>'});
</script></body></html>
